<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PSYAGENT - IA de Apoyo Emocional</title>
    <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 16px; background-color: #f8f9fa; }
    h1 { color: #2c3e50; text-align: center; font-size: 28px; }
    p.sub { text-align: center; color: #7f8c8d; margin-top: -10px; margin-bottom: 25px; }
    #chat { border: 1px solid #e2e8f0; height: 460px; overflow-y: auto; padding: 15px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .usuario { background: #e0f2fe; color: #0369a1; padding: 12px; margin: 10px 0; border-radius: 10px; text-align: right; margin-left: 20%; }
    .agente { background: #f1f5f9; color: #334155; padding: 12px; margin: 10px 0; border-radius: 10px; white-space: pre-wrap; margin-right: 20%; line-height: 1.5; }
    .traza { font-size: 13px; color: #94a3b8; font-style: italic; text-align: center; }
    .input-area { margin-top: 15px; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    button { padding: 12px 24px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
    button:hover { background: #0369a1; }
    .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 15px; }
    </style>
</head>
    <body>
    <h1>🧠 PSYAGENT</h1>
    <p class="sub">Agente de Apoyo Emocional con RAG y Botón de Freno</p>

    <div id="chat">
    <div class="agente">Hola, soy PSYAGENT. Estoy aquí para escucharte sin juzgarte. ¿Cómo te sientes hoy o qué te preocupa?</div>
    </div>

    <div class="input-area">
    <input id="pregunta" placeholder="Escribe tu mensaje aquí..." onkeydown="if(event.key==='Enter') preguntar()">
    <button onclick="preguntar()">Enviar</button>
    </div>

    <div class="footer">🛡️ Sistema equipado con Botón de Freno y detección de crisis en tiempo real.</div>

    <script>
    let conversacionId = crypto.randomUUID();

    function añadirAlChat(clase, texto) {
    const div = document.createElement("div");
    div.className = clase;
    div.textContent = texto;
    const chat = document.getElementById("chat");
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
    }

    async function preguntar() {
    const input = document.getElementById("pregunta");
    const texto = input.value.trim();
    if (!texto) return;
    input.value = "";
    añadirAlChat("usuario", texto);
    const pensando = añadirAlChat("traza", "PSYAGENT está pensando...");

    const res = await fetch("/api/agente", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversacion_id: conversacionId, mensaje: texto }),
    });
    const datos = await res.json();
    pensando.remove();
    añadirAlChat("agente", datos.respuesta);
    }
    </script>
    </body>
</html>
